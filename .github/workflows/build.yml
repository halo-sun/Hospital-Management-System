# ============================================================================
# Windows Build + Installer — Hospital Management System
# ============================================================================
#
# PREREQUISITE: A GitHub remote must exist and the source code must be pushed
# before this workflow can run.  If the repository has no remote, create one
# via GitHub's web UI or the `gh` CLI, then push:
#
#     git remote add origin https://github.com/<you>/HospitalSchedulingSystem.git
#     git push -u origin main
#
# TRIGGERS
# --------
# • Pushing a version tag (e.g. v1.0.0) starts a release build automatically.
# • The "Run workflow" button on the Actions tab triggers a manual build.
#
# WHAT IT DOES
# ------------
# 1. Checks out the repo on a Windows runner with Python 3.12.
# 2. Installs runtime + dev dependencies (dev deps for the test step only).
# 3. Runs the full test suite — the build is aborted if any test fails.
# 4. Builds HospitalScheduler.exe and HMS-Setup.exe via PyInstaller.
# 5. Compiles the Inno Setup installer (.iss → .exe).
# 6. Uploads the installer as the final artifact.
#
# ⚠️  VERIFICATION GAP — READ BEFORE DEPLOYING
# --------------------------------------------
# CI success alone does NOT prove the exe works on a real Windows machine.
# The built installer must be tested on:
#   • A Windows 10/11 VM (VirtualBox or VMware — both free for personal use), OR
#   • A physical Windows machine.
#
# Specific things to verify after downloading the artifact:
#   • The installer launches and displays the LICENSE.
#   • Database Setup wizard runs after installation completes.
#   • The main app launches from the Start Menu shortcut.
#   • Analytics charts render (matplotlib + TkAgg backend works).
#   • Uploading a patient document succeeds (Pillow ImageTk works).
#   • The calendar date-picker works (tkcalendar + babel locale data).
#   • Uninstaller asks about removing user data directory.
#
# Do NOT consider the app "Windows-ready" until at least the above
# checklist has been manually verified.
# ============================================================================

name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'          # e.g. v1.0.0, v1.2.3-beta
  workflow_dispatch:   # manual trigger from Actions tab

env:
  PYTHON_VERSION: '3.12'

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python setup ───────────────────────────────────────
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      # ── 3. Install dependencies ───────────────────────────────
      #    Runtime deps are what get bundled into the exe.
      #    Dev deps (pytest, black, etc.) are only for the test step.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ── 4. Run test suite (fail-fast) ─────────────────────────
      #    The build is aborted if any test fails — we never ship
      #    broken code.
      - name: Run tests
        run: python -m pytest tests/ -x -q --tb=short

      # ── 5. Extract version from tag (if present) ──────────────
      - name: Extract version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      # ── 5b. Verify tag matches AppConfig.VERSION ──────────────
      - name: Verify tag matches AppConfig.VERSION
        shell: bash
        run: |
          TAG_VERSION="${{ steps.version.outputs.version }}"
          # Extract AppConfig.VERSION from source (no import needed)
          CODE_VERSION=$(python -c "import re, pathlib; m=re.search(r'VERSION:\s*ClassVar\[str\]\s*=\s*\"([^\"]+)\"', pathlib.Path('src/config/settings.py').read_text()); print(m.group(1))")
          echo "Git tag version: $TAG_VERSION"
          echo "AppConfig.VERSION: $CODE_VERSION"
          if [ "$TAG_VERSION" != "$CODE_VERSION" ]; then
            echo "::error::Version mismatch: git tag says '$TAG_VERSION' but AppConfig.VERSION is '$CODE_VERSION'. Bump AppConfig.VERSION in src/config/settings.py to match the tag."
            exit 1
          fi
          echo "Versions match: $TAG_VERSION"

      # ── 5c. Export BUILD_VERSION for generate_iss.py ──────────
      - name: Export BUILD_VERSION
        shell: bash
        run: |
          echo "BUILD_VERSION=${{ steps.version.outputs.version }}" >> "$GITHUB_ENV"
          echo "Set BUILD_VERSION=${{ steps.version.outputs.version }}"

      # ── 6. Build main application with PyInstaller ────────────
      - name: Build HospitalScheduler.exe
        run: pyinstaller hms.spec --noconfirm

      # ── 7. Build setup utility with PyInstaller ───────────────
      - name: Build HMS-Setup.exe
        run: pyinstaller hms-setup.spec --noconfirm

      # ── DIAGNOSTIC A: Dump dist folder contents immediately after PyInstaller ──
      - name: DIAGNOSTIC - dump dist folder contents after PyInstaller
        run: |
          Write-Host "=== dist\HospitalScheduler ==="
          Write-Host "File count:"
          (Get-ChildItem -Recurse dist\HospitalScheduler -File | Measure-Object).Count
          Write-Host "Total size:"
          (Get-ChildItem -Recurse dist\HospitalScheduler -File | Measure-Object -Property Length -Sum).Sum
          Write-Host "Full listing:"
          Get-ChildItem -Recurse dist\HospitalScheduler | Select-Object FullName, Length | Format-Table -AutoSize
          Write-Host "=== dist\HMS-Setup ==="
          Write-Host "File count:"
          (Get-ChildItem -Recurse dist\HMS-Setup -File | Measure-Object).Count
          Write-Host "Total size:"
          (Get-ChildItem -Recurse dist\HMS-Setup -File | Measure-Object -Property Length -Sum).Sum
          Write-Host "Full listing:"
          Get-ChildItem -Recurse dist\HMS-Setup | Select-Object FullName, Length | Format-Table -AutoSize
          Write-Host "=== Confirm HospitalScheduler.exe exists ==="
          if (Test-Path dist\HospitalScheduler\HospitalScheduler.exe) {
            $f = Get-Item dist\HospitalScheduler\HospitalScheduler.exe
            Write-Host "HospitalScheduler.exe: $($f.Length) bytes"
          } else {
            Write-Host "ERROR: HospitalScheduler.exe NOT FOUND in dist\HospitalScheduler"
          }
          if (Test-Path dist\HMS-Setup\HMS-Setup.exe) {
            $f = Get-Item dist\HMS-Setup\HMS-Setup.exe
            Write-Host "HMS-Setup.exe: $($f.Length) bytes"
          } else {
            Write-Host "ERROR: HMS-Setup.exe NOT FOUND in dist\HMS-Setup"
          }
        shell: pwsh

      # ── 8. Verify build outputs (fail loudly if empty/missing) ──────
      - name: Verify build outputs
        shell: bash
        run: |
          for DIR in dist/HospitalScheduler dist/HMS-Setup; do
            if [ ! -d "$DIR" ]; then
              echo "::error::$DIR directory not found"
              exit 1
            fi
            FILE_COUNT=$(find "$DIR" -type f | wc -l)
            if [ "$FILE_COUNT" -eq 0 ]; then
              echo "::error::$DIR is empty"
              exit 1
            fi
            echo "Verified: $DIR contains $FILE_COUNT files"
            ls -lh "$DIR"
          done
          for EXE in dist/HospitalScheduler/HospitalScheduler.exe dist/HMS-Setup/HMS-Setup.exe; do
            if [ ! -f "$EXE" ]; then
              echo "::error::$EXE not found"
              exit 1
            fi
            echo "Verified: $EXE"
            ls -lh "$EXE"
          done

      # ── 9. Regenerate setup.iss and compile installer ─────────
      #    ISCC.exe is pre-installed on windows-latest runners.
      #    generate_iss.py reads BUILD_VERSION from the environment
      #    (set in step 5c) so the installer filename matches the tag.
      - name: Regenerate setup.iss from AppConfig
        run: python installer/windows/generate_iss.py

      # ── DIAGNOSTIC B: Dump setup.iss and check resolved paths from CI's CWD ──
      - name: DIAGNOSTIC - dump setup.iss and resolved paths before ISCC
        run: |
          Write-Host "=== Current working directory ==="
          Get-Location
          Write-Host ""
          Write-Host "=== setup.iss [Files] section (all lines) ==="
          $content = Get-Content installer\windows\setup.iss
          $inFiles = $false
          foreach ($line in $content) {
            if ($line -match '^\[Files\]') { $inFiles = $true }
            if ($inFiles -and $line -match '^\[' -and $line -notmatch '^\[Files\]') { $inFiles = $false }
            if ($inFiles) { Write-Host $line }
          }
          Write-Host ""
          Write-Host "=== #define for MainDistDir / SetupDistDir ==="
          Select-String -Path installer\windows\setup.iss -Pattern 'define.*(MainDistDir|SetupDistDir)' | ForEach-Object { Write-Host $_.Line }
          Write-Host ""
          Write-Host "=== Does dist\HospitalScheduler exist from CWD? ==="
          Test-Path "dist\HospitalScheduler"
          if (Test-Path "dist\HospitalScheduler") {
            Write-Host "File count in dist\HospitalScheduler from CWD:"
            (Get-ChildItem "dist\HospitalScheduler" -File | Measure-Object).Count
          }
          Write-Host ""
          Write-Host "=== Does dist\HMS-Setup exist from CWD? ==="
          Test-Path "dist\HMS-Setup"
          if (Test-Path "dist\HMS-Setup") {
            Write-Host "File count in dist\HMS-Setup from CWD:"
            (Get-ChildItem "dist\HMS-Setup" -File | Measure-Object).Count
          }
          Write-Host ""
          Write-Host "=== Full resolved path check ==="
          Write-Host "Repo root CWD: $(Get-Location)"
          Write-Host "installer\windows\setup.iss exists: $(Test-Path 'installer\windows\setup.iss')"
          Write-Host "dist\HospitalScheduler exists: $(Test-Path 'dist\HospitalScheduler')"
          Write-Host "dist\HMS-Setup exists: $(Test-Path 'dist\HMS-Setup')"
        shell: pwsh

      - name: Compile installer (Inno Setup) - VERBOSE
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /V9 "installer\windows\setup.iss"
        shell: pwsh

      # ── DIAGNOSTIC C: Inspect actual compiled installer contents ──
      - name: DIAGNOSTIC - inspect compiled installer contents with 7-Zip
        run: |
          Write-Host "=== Installing 7-Zip ==="
          choco install 7zip -y --no-progress
          Write-Host ""
          Write-Host "=== Looking for installer in dist\ ==="
          Get-ChildItem dist\*-Setup.exe | ForEach-Object {
            Write-Host "Found: $($_.FullName) ($($_.Length) bytes)"
            Write-Host ""
            Write-Host "=== Contents of $($_.Name) via 7z ==="
            & "C:\Program Files\7-Zip\7z.exe" l $_.FullName
          }
          if (-not (Get-ChildItem dist\*-Setup.exe -ErrorAction SilentlyContinue)) {
            Write-Host "ERROR: No *-Setup.exe found in dist\"
            Write-Host "Contents of dist\:"
            Get-ChildItem dist\ -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
          }
        shell: pwsh

      # ── 10. Verify installer exists ────────────────────────────
      - name: Verify installer output
        shell: bash
        run: |
          INSTALLER="dist/HospitalScheduler-${{ steps.version.outputs.version }}-Setup.exe"
          if [ ! -f "$INSTALLER" ]; then
            echo "::error::Installer not found at $INSTALLER"
            ls -la dist/
            exit 1
          fi
          echo "Installer verified: $INSTALLER"
          ls -lh "$INSTALLER"

      # ── 11. Upload installer artifact ──────────────────────────
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: hms-installer-${{ steps.version.outputs.version }}
          path: dist/HospitalScheduler-*-Setup.exe
          retention-days: 30
          if-no-files-found: error

      # ── 12. Create GitHub Release (on tag pushes only) ──────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HospitalScheduler-${{ env.BUILD_VERSION }}-Setup.exe
          generate_release_notes: true

      # ── 13. Also upload raw PyInstaller output (backup) ────────
      - name: Upload raw build (backup)
        uses: actions/upload-artifact@v4
        with:
          name: hms-windows-${{ steps.version.outputs.version }}
          path: dist/HospitalScheduler/
          retention-days: 14
          if-no-files-found: error
